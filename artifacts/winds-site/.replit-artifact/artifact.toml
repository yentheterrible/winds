kind = "web"
previewPath = "/"
title = "Winds"
description = "A polished, responsive product website for Winds, a premium Blade Ball script hub, featuring product capabilities, Auto Parry, real community reviews, exact pricing and purchase links, key options, loader access, and Discord community links."
version = "1.0.0"
id = "artifacts/winds-site"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21304

[services.development]
run = "pnpm --filter @workspace/winds-site run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/winds-site", "run", "build" ]
serve = "static"
publicDir = "artifacts/winds-site/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21304"
BASE_PATH = "/"
